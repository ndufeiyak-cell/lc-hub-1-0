<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a4d8c" />
  <title>Offline | LC Hub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .offline-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .offline-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      color: white;
    }
    .offline-wrap h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 0.75rem;
    }
    .offline-wrap p {
      color: var(--gray-500);
      max-width: 420px;
      margin-bottom: 1.75rem;
    }
    .offline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="LC Hub Home">
        <span class="logo-icon">LC</span>
        <span>LC Hub</span>
      </a>
    </div>
  </header>

  <div class="offline-wrap">
    <div class="offline-icon" aria-hidden="true">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>
      LC Hub needs a network connection for some features, but previously visited pages and your account data (IndexedDB) are still available.
    </p>
    <div class="offline-actions">
      <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
      <a href="index.html" class="btn btn-outline">Go to Home</a>
      <a href="learn.html" class="btn btn-outline">Learn (cached)</a>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => { location.reload(); });
  </script>
</body>
</html>
